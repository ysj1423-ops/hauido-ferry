name: skill-test
# 시험용: 모델 정확도 평가를 돌려 결과만 출력(커밋하지 않음)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          SKILL=1 BACKFILL=0 NTFY_TOPIC= DATA_GO_KR_KEY= node scripts/collect.mjs | tail -3
          node -e "const d=require('./docs/data/latest.json');const k=d.modelSkill;console.log('SKILL',k&&k.from,k&&k.to);for(const [l,x] of Object.entries(k?.leads||{}))console.log('LEAD',l,x.n,x.cancellations,JSON.stringify(x.brier),JSON.stringify(x.methods),x.chosen);for (const [l,x] of Object.entries(k?.fogLeads||{}))console.log('FOG',l,x.n,x.cancellations,JSON.stringify(x.brier),JSON.stringify(x.methods),x.chosen);console.log('SRC',JSON.stringify(d.sources.filter(s=>!s.ok)));const day=d.days.at(-1);console.log('LAST',day.date,JSON.stringify(day.sailings.slice(0,4).map(s=>[s.time,Math.round(s.p*100),s.method,s.flags,s.byModel])))"
