name: collect
# 한 번 실행에 한 번만 수집한다.
# GitHub 예약 실행이 몇 시간씩 늦거나 빠지는 일이 잦아서, 실행이 끝날 때 다음 확인 시각까지 기다렸다가
# 다음 실행을 스스로 시작한다(이어달리기). 예약 실행은 이어달리기가 끊겼을 때 다시 잇는 예비용.
# 확인 시각(한국): 05~21시 15분 간격, 그 외 30분 간격, 12:05~12:25 5분 간격(내일 예보 받기 전까지), 17:05
# 공공데이터 API(배 위치·섬 출발 시각)는 12시대 실행에서 하루 한 번만 부른다.
on:
  schedule:
    - cron: "15 * * * *"
    - cron: "5,15,25 3 * * *"   # 12:05·12:15·12:25 KST (다음 날 운항예보 직후, 이어달리기 예비)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Read the newest committed history cache, including queued runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect and predict
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/collect.mjs
      - name: Commit data
        run: |
          git config user.name "ferry-bot"
          git config user.email "ferry-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -q -m "data: $(TZ=Asia/Seoul date +%m-%d\ %H:%M) KST"
          pushed=0
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs origin main && git push -q; then pushed=1; break; fi
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "Data/cache push failed" >&2; exit 1; }
      - name: Start model scoring if stale
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale=$(node -e "const fs=require('fs');let d=null;try{d=JSON.parse(fs.readFileSync('docs/data/model-skill.json'))}catch(e){};const t=new Date(Date.now()+9*3600e3);t.setUTCDate(t.getUTCDate()-7);console.log(!d||!d.fogLeads||d.computedOn<=t.toISOString().slice(0,10)?1:0)")
          busy=$(gh api "repos/${{ github.repository }}/actions/workflows/skill.yml/runs?per_page=3" --jq '[.workflow_runs[]|select(.status!="completed")]|length' 2>/dev/null || echo 1)
          if [ "$stale" = 1 ] && [ "$busy" = 0 ]; then gh workflow run skill.yml --ref main -R ${{ github.repository }} && echo "모델 성적 계산 시작"; fi
      - name: Wait and start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tomorrow=$(TZ=Asia/Seoul date -d tomorrow +%Y-%m-%d)
          have_tomorrow=$(node -e "const d=require('./docs/data/latest.json');console.log(d.tomorrowIssued&&d.tomorrowIssued.date==='$tomorrow'?1:0)" 2>/dev/null || echo 0)
          now=$(date +%s); best=0
          for add in 0 1; do
            day=$(TZ=Asia/Seoul date -d "+$add day" +%Y-%m-%d)
            slots=""; for h in $(seq 0 23); do slots="$slots $(printf %02d $h):00 $(printf %02d $h):30"; if [ $h -ge 5 ] && [ $h -le 20 ]; then slots="$slots $(printf %02d $h):15 $(printf %02d $h):45"; fi; done
            slots="$slots 17:05"
            if [ "$have_tomorrow" = 0 ] || [ $add = 1 ]; then slots="$slots 12:05 12:10 12:15 12:20 12:25"; fi
            for s in $slots; do t=$(TZ=Asia/Seoul date -d "$day $s" +%s); if [ $t -gt $((now + 60)) ] && { [ $best = 0 ] || [ $t -lt $best ]; }; then best=$t; fi; done
          done
          wait=$((best - now - 45)); [ $wait -lt 0 ] && wait=0
          echo "다음 확인: $(TZ=Asia/Seoul date -d @$best '+%m-%d %H:%M') KST ($wait초 대기)"
          sleep $wait
          others=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?per_page=10" --jq "[.workflow_runs[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\") and .id != ${{ github.run_id }})] | length")
          if [ "$others" != 0 ]; then echo "이미 대기 중인 실행이 있어 건너뜀"; exit 0; fi
          # 다음 실행을 시작하고, GitHub 쪽 시작 실패(startup_failure)면 최대 3번 다시 시도한다
          for try in 1 2 3; do
            gh workflow run collect.yml --ref main -R ${{ github.repository }} || true
            sleep 40
            st=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?per_page=5" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0] | (.status + \" \" + (.conclusion // \"\"))")
            echo "다음 실행 상태($try): $st"
            case "$st" in queued*|in_progress*|waiting*|pending*|"completed success") echo "다음 실행 시작됨"; exit 0;; esac
            sleep 20
          done
          echo "다음 실행을 시작하지 못함(예약 실행이 이어받음)"
