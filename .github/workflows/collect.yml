name: collect
# 한 번 실행에 한 번만 수집한다(같은 사이트를 짧은 간격으로 반복 호출하지 않음).
# 30분마다 + KOMSA 발표 직후(12:10, 14:10, 17:10 한국 시각) 한 번씩.
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "10 3 * * *"   # 12:10 KST
    - cron: "10 5 * * *"   # 14:10 KST
    - cron: "10 8 * * *"   # 17:10 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect and predict
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/collect.mjs
      - name: Commit data
        run: |
          git config user.name "ferry-bot"
          git config user.email "ferry-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -q -m "data: $(TZ=Asia/Seoul date +%m-%d\ %H:%M) KST"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
